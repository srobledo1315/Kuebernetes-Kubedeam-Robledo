---
- name: Instalar paquete DHCP
  ansible.builtin.package:
    name: "{{ dhcp_packages }}"
    state: present

- name: Habilitar puerto DHCP en firewalld
  ansible.posix.firewalld:
    service: dhcp
    permanent: true
    state: enabled
  register: dhcp_firewalld_result
  failed_when:
    - dhcp_firewalld_result.failed
    - "'is not running' not in dhcp_firewalld_result.msg | default('')"

- name: Asegurar que DHCP escuche solo en la interfaz definida
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/dhcpd
    regexp: '^DHCPDARGS='
    line: 'DHCPDARGS="{{ dhcp_interface }}"'
    create: true
    mode: '0644'
  notify: Restart dhcpd

- name: Desplegar configuración de dhcpd con validación sintáctica
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'dhcpd -t -cf %s'
  notify: Restart dhcpd

- name: Asegurar que el servicio DHCP está habilitado y en ejecución
  ansible.builtin.service:
    name: dhcpd
    state: started
    enabled: true
